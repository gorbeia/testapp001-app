# Typecheck, Prettier, ESLint (errors only), production build — runs on every PR and push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elkartearen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elkartearen_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/elkartearen_test
      JWT_SECRET: github-actions-integration-test-jwt-not-for-production
      SESSION_SECRET: github-actions-integration-test-session-not-for-production
      BACKOFFICE_JWT_SECRET: github-actions-integration-test-backoffice-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database schema
        run: pnpm db:push --force
        env:
          ALLOW_PRODUCTION_DB_OPS: "1"

      - name: Seed database
        run: pnpm db:seed
        timeout-minutes: 5

      - name: Prettier
        run: pnpm format:check

      - name: TypeScript
        run: pnpm check

      - name: ESLint (errors only)
        run: pnpm lint:ci

      - name: Unit tests (Vitest)
        run: pnpm test:unit
        env:
          NODE_ENV: test

      - name: Integration tests (Cucumber + Supertest)
        run: pnpm test:integration
        env:
          NODE_ENV: test

      - name: Build
        run: pnpm build
