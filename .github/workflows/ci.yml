# Typecheck, Prettier, ESLint (errors only), production build — runs on every PR and push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: TypeScript
        run: pnpm check

      - name: ESLint (errors only)
        run: pnpm lint:ci

      - name: Unit tests (Vitest)
        run: pnpm test:unit
        env:
          NODE_ENV: test
          # server/db.ts throws if unset; unit tests mock DB but this avoids accidental real imports in CI
          DATABASE_URL: postgresql://127.0.0.1:5432/vitest_ci

      - name: Build
        run: pnpm build
